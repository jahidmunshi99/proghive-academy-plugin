<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <!-- Title -->
    <title>Login Form</title>
    <!-- CSS Custom -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Bootstrap CDN-->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous"> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script> -->
  <style>
        /* ===== GOOGLE FONT ===== */
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans&display=swap');
    /* ===== Base ===== */
    *,::after, ::before{
        box-sizing: border-box;    
    }
    :root{
        --body-color:#000;
        --light-white-color:#fff;
        --input-color:#C5C3BF;
        --border-color:#DCDDE1;
        --btn-bg-hover-color:#E61F23;
        /* Typography */
        --body-font:'Josefin Sans', sans-serif;
        --normal-font-size:1.2rem;
        --small-font-size:1rem;
    }

    body{
        background: var(--body-color);
        font: var(--body-font)
    }
    .login-main .container, 
    .container-fluid, 
    .container-lg, 
    .container-md, 
    .container-sm, 
    .container-xl, 
    .container-xxl {
      --bs-gutter-x: 1.5rem;
      --bs-gutter-y: 0;
      width: 100%;
      padding-right: calc(var(--bs-gutter-x) * .5);
      padding-left: calc(var(--bs-gutter-x) * .5);
      margin-right: auto;
      margin-left: auto;
    }
    .row {
      --bs-gutter-x: 1.5rem;
      --bs-gutter-y: 0;
      display: flex;
      flex-wrap: wrap;
      margin-top: calc(-1 * var(--bs-gutter-y));
      margin-right: calc(-.5 * var(--bs-gutter-x));
      margin-left: calc(-.5 * var(--bs-gutter-x));
    }

    .col-12 {
      flex: 0 0 auto;
      width: 100%;
    }


    /* ===== FORM MAIN ===== */
    .login-main{
        background: url('/assets/img/bg.jpg') no-repeat center /cover;
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;  
    }

    .login-form{
        max-width: 420px;
        background: var(--light-white-color);
        padding: 70px 35px;
        position: relative;
        margin: 0 auto;
        border-radius: 5px;
        box-shadow: 0 4px 10px var(--input-color);
    }

    .login-form::after{
        content: "";
        width: 195px;
        height: 50px;
        background: url('/assets/img/after.png') no-repeat center /cover;
        top:0;
        right:0;
        position: absolute;
    }

    .login-form::before{
        content: "";
        width: 195px;
        height: 50px;
        background: url('/assets/img/before.png') no-repeat center /cover;
        bottom:0;
        left:0;
        position: absolute;
    }

    .login-form .logo-image img{
        width: 100px;
    }

    .login-form .form-title{
        margin: 1rem 0 2rem 0;
    }

    .login-form .form-group{
        margin-bottom: 20px;
        height: 55px;
        position: relative;
    }
    .login-form .form-group input{
      width: 100%;
      padding: 10px;
    }


    .form-group .form-control{   
        height: 100%;
        background: none;
        outline: 0;
        border: 1px solid var(--border-color);
        position: absolute;
        top: 0;
        left: 0;
    }

    .form-group .form-control:focus{
        box-shadow: none;
        border: 1px solid var(--body-color);
    }

    .form-label{
        position: absolute;
        left: 1rem;
        top: 1rem;
        padding: 0 0.5rem;
        color: var(--input-color);
        transition: 0.3s;
    }

    .form-control:focus + .form-label,
    .form-control:not(:placeholder-shown).form-control:not(:focus)+ .form-label{
        left: 1rem;
        top: -0.9rem;
        font-size: var(--small-font-size);
        color: var(--body-color);
        z-index: 10;
        background: var(--light-white-color);
        
    }


    .btn-theme{
        height: 2.5rem;
        background: var(--body-color);
        color: var(--light-white-color);
        outline: 0;
        border: 0;
        padding: 0.5rem 0;
        border-radius: 0.3rem;
        line-height: 0;
        transition: 0.3s;
    }

    .btn-theme:hover{
        background: var(--btn-bg-hover-color);
    }
  </style>

</head>
<body>
    <!-- ***** Login Main Start ***** -->
    <div class="login-main">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <!-- Login Form Start -->
                    <div class="login-form">
                        <!-- Logo Image Start -->
                        <div class="logo-image">
                            <a href="#">
                                <img src="assets/img/logo.png" alt="image">
                            </a>
                        </div>
                        <!-- Logo Image Start -->
                        <!-- Form Title Start -->
                        <div class="form-title">
                            <h3>Sign Into Your account</h3>
                        </div>
                        <!-- Form Title End -->
                        <!-- Form Input Start -->
                        <div class="form">
                            <form action="" method="post">
                                <!-- Form Group-1 Start -->
                                <div class="form-group">
                                    <input type="email" class="form-control" name="email" autocomplete="off" aria-label="Email" placeholder="">
                                    <label class="form-label">Email</label>
                                </div>
                                <!-- Form Group-1 End -->
                                <!-- Form Group-2 Start -->
                                <div class="form-group">
                                    <input type="password" class="form-control" name="password" autocomplete="off" aria-label="Password" placeholder="">
                                    <label class="form-label">Password</label>
                                </div>
                                <!-- Form Group-2 End -->
                                <!-- Form Group-3 Start -->
                                <div class="form-group mb-0">
                                    <button class=" btn-theme col-12">Login</button>
                                </div>
                                <!-- Form Group-3 End -->
                            </form>
                        </div>
                        <!-- Form Input End -->
                    </div>
                    <!-- Login Form Start -->
                </div>
            </div>
        </div>
    </div>
    <!-- ***** Login Main End ***** -->    
</body>
</html>
